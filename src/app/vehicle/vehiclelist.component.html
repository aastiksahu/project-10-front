<div class="insurance-page">

    <div class="floating-circle circle1"></div>
    <div class="floating-circle circle2"></div>
    <div class="floating-circle circle3"></div>

    <div class="container">

        <div class="insurance-list-card">

            <!-- Header -->

            <div class="text-center mb-4">

                <span class="badge-custom">
                    🚗 Vehicle Management
                </span>

                <h1 class="page-title">
                    Vehicle List
                </h1>

                <p class="page-subtitle">
                    Search, manage and maintain vehicle records
                </p>

                <h5 class="text-success"
                    *ngIf="!form.error && form.message">
                    {{form.message}}
                </h5>

                <h5 class="text-danger"
                    *ngIf="form.error && form.message">
                    {{form.message}}
                </h5>

            </div>


            <!-- Search Panel -->

            <div class="search-card">

                <div class="row justify-content-center">

                    <!-- Vehicle Name -->

                    <div class="col-md-3 mb-3">

                        <input type="text"
                               class="form-control"
                               placeholder="Vehicle Name"
                               [(ngModel)]="form.searchParams.vehicleName">

                    </div>


                    <!-- Model -->

                    <div class="col-md-3 mb-3">

                        <input type="text"
                               class="form-control"
                               placeholder="Model"
                               [(ngModel)]="form.searchParams.model">

                    </div>


                    <!-- Color -->

                    <div class="col-md-3 mb-3">

                        <input type="text"
                               class="form-control"
                               placeholder="Color"
                               [(ngModel)]="form.searchParams.color">

                    </div>


                    <!-- Price -->

                    <div class="col-md-3 mb-3">

                        <input type="number"
                               class="form-control"
                               placeholder="Price"
                               [(ngModel)]="form.searchParams.price">

                    </div>

                </div>


                <!-- Search / Reset -->

                <div class="text-center">

                    <button class="btn-save me-2"
                            (click)="search()">

                        Search

                    </button>

                    <button class="btn-reset"
                            (click)="reset()">

                        Reset

                    </button>

                </div>

            </div>


            <!-- Table -->

            <div class="table-responsive mt-4"
                 *ngIf="form.list.length > 0">

                <table class="table custom-table">

                    <thead>

                        <tr>

                            <th>

                                <input type="checkbox"
                                       [(ngModel)]="isMasterSel"
                                       (change)="checkUncheckAll($event)">

                            </th>

                            <th>S.No</th>

                            <th>Vehicle Name</th>

                            <th>Model</th>

                            <th>Color</th>

                            <th>Price</th>

                            <th>Edit</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr *ngFor="let m of form.list; let i=index">

                            <!-- Checkbox -->

                            <td>

                                <input type="checkbox"
                                       #checkboxes
                                       (change)="checklistUpdate()"
                                       [id]="m.id">

                            </td>


                            <!-- Serial Number -->

                            <td>

                                {{(form.pageNo*5)+i+1}}

                            </td>


                            <!-- Vehicle Name -->

                            <td>

                                {{m.vehicleName}}

                            </td>


                            <!-- Model -->

                            <td>

                                {{m.model}}

                            </td>


                            <!-- Color -->

                            <td>

                                {{m.color}}

                            </td>


                            <!-- Price -->

                            <td>

                                ₹ {{m.price}}

                            </td>


                            <!-- Edit -->

                            <td>

                                <button class="btn btn-sm btn-primary"
                                        (click)="forward('/vehicle/' + m.id)">

                                    Edit

                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <!-- Footer Buttons -->

            <div class="action-panel mt-4">

                <button class="btn-reset"
                        (click)="previous()"
                        [disabled]="form.pageNo == 0">

                    Previous

                </button>


                <button class="btn-save"
                        (click)="forward('/vehicle')">

                    New Vehicle

                </button>


                <button class="btn-danger-custom"
                        (click)="deleteMany()">

                    Delete

                </button>


                <button class="btn-save"
                        (click)="next()"
                        [disabled]="form.nextListSize == 0">

                    Next

                </button>

            </div>

        </div>

    </div>

</div>
